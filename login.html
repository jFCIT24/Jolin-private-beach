<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <title>Jolin Private Beach | Login</title>
</head>

<body>

  <header>
    <h2 class="logo">Jolin Private Beach</h2>
    <nav class="menu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign-up</a></li>
        <li><a href="about.html">About Us</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <div class="banner">
      <img src="images/entrance.jpg" alt="Jolin entrance" width="800" height="300" usemap="#aboutmap">
      <map name="aboutmap">
        <area shape="rect" coords="0,0,400,300" href="about.html" alt="About Us">
      </map>
    </div>

    <div class="box form-box">
      <h1>Login</h1>

      <form onsubmit="return checkLogin()">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="name@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters">

        <p id="message"></p>

        <button type="submit">Login</button>
      </form>

      <p>No account? <a href="signup.html">Sign up here</a></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
